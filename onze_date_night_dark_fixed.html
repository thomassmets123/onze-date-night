<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Our Date Night ❤️</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 10%,#ffeaf3,transparent 35%),linear-gradient(145deg,#fff8fb,#fff);font-family:system-ui,sans-serif;color:#321d28;display:flex;justify-content:center;padding:16px;overflow-x:hidden}#app{width:min(720px,100%)}.box{position:relative;overflow:hidden;background:#fff;border:1px solid #ead8e0;border-radius:28px;padding:22px;box-shadow:0 20px 60px #63213a18}.center{text-align:center}.ey{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:#c02668}h1{font-size:38px;line-height:1;margin:10px 0}h2{font-size:26px;line-height:1.1}.muted{color:#806c75;line-height:1.5}.heart{font-size:68px;animation:float 2s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px) rotate(4deg)}}.btn{border:0;border-radius:15px;padding:12px 18px;min-height:48px;font:inherit;font-weight:800;cursor:pointer}.pink{background:#c02668;color:white}.soft{background:#ffe8f2}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.bar{height:6px;background:#f2e5ea;border-radius:99px;margin:16px 0 24px;overflow:hidden}.bar i{display:block;height:100%;background:#c02668;transition:.6s}.scene{animation:in .55s ease}@keyframes in{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{min-height:125px;border:1px solid #ead8e0;border-radius:20px;background:white;padding:0;perspective:900px;overflow:hidden;cursor:pointer}.inner{position:relative;width:100%;height:125px;transform-style:preserve-3d;transition:.65s cubic-bezier(.2,.8,.2,1)}.card.flip{border:2px solid #e58ab6;background:#211824;transform:translateY(-3px);box-shadow:0 0 0 2px rgba(229,138,182,.18),0 12px 28px rgba(229,80,150,.18)}.card.flip .inner{transform:rotateY(180deg)}.front,.back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:15px;display:flex;flex-direction:column;justify-content:center;text-align:left}.back{transform:rotateY(180deg);background:#211824;color:#f8edf4}.emoji{font-size:32px}.small{font-size:12px;color:#806c75;margin-top:4px}.wheel{width:250px;height:250px;border-radius:50%;margin:18px auto;background:conic-gradient(#ffd0e1 0 25%,#f8d6bd 25% 50%,#e2d5f2 50% 75%,#d6eedb 75%);border:10px solid white;box-shadow:0 12px 30px #63213a20;display:grid;place-items:center;font-size:55px;transition:transform 1.5s cubic-bezier(.15,.8,.15,1)}.pointer{font-size:28px;text-align:center}.roll{animation:roll .7s}@keyframes roll{to{transform:rotate(360deg) scale(1.08)}}.bouquet{height:190px;border:1px solid #ead8e0;border-radius:20px;display:grid;place-items:center;font-size:95px;background:linear-gradient(#fff5fa,#fff)}.flowers{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}.flower{background:white;border:1px solid #ead8e0;border-radius:15px;padding:10px;cursor:pointer}.flower.on{background:#ffe8f2;border:2px solid #c02668;transform:translateY(-4px) rotateY(180deg)}.couch{height:180px;border-radius:20px;background:linear-gradient(150deg,#402936,#1d151a);display:grid;place-items:center;color:white;font-size:60px}.final{animation:final .8s ease}@keyframes final{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}.rows{text-align:left;background:#fff7fa;border:1px solid #ead8e0;border-radius:18px;padding:12px;margin-top:18px}.row{padding:10px 0;border-bottom:1px solid #ead8e0}.row:last-child{border:0}.code{font-size:28px;letter-spacing:.25em;font-weight:900;background:#ffe8f2;border-radius:15px;padding:15px;margin:18px 0}.petal{position:fixed;top:-30px;pointer-events:none;animation:fall 4s linear forwards;z-index:9}@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:0}}@media(max-width:520px){h1{font-size:31px}.grid{grid-template-columns:1fr 1fr}.card,.inner{min-height:115px;height:115px}.box{padding:17px}}

/* DARK ROMANTIC THEME + CARD FLIP */
html,body{
  background:
    radial-gradient(circle at 20% 10%, rgba(110,25,70,.22), transparent 32%),
    radial-gradient(circle at 80% 85%, rgba(45,20,70,.25), transparent 35%),
    #08080d !important;
  color:#f5edf3;
}
body::before{
  opacity:.22;
}
.card,.panel,.game,.scene,.question{
  background:rgba(18,16,24,.94) !important;
  border-color:rgba(255,255,255,.10) !important;
}
.card{background:#15121a !important;color:#f5edf3;border-color:rgba(255,255,255,.12) !important;overflow:hidden}
.card .front{background:#15121a;color:#f5edf3}
.card .back{background:#211824;color:#f8edf4}
.card.flip{border-color:#e58ab6 !important;box-shadow:0 0 0 2px rgba(229,138,182,.28),0 12px 35px rgba(229,80,150,.16) !important}
.flower{background:#15121a;color:#f5edf3;border-color:rgba(255,255,255,.12)}
.flower.on{background:#211824;border-color:#e58ab6}
.bouquet{background:#15121a;border-color:rgba(255,255,255,.12)}
.rows{background:#15121a;border-color:rgba(255,255,255,.12)}
.row{border-color:rgba(255,255,255,.08)}
.code{background:#211824}
.soft{background:#2a2029;color:#f5edf3}
.bar{background:#2a232b}
.muted{color:#bba9b3}
.ey{color:#e58ab6}

</style></head><body><main id="app"><div class="box" id="box"></div></main>
<script>
(()=>{const box=document.getElementById("box");let n=-1,A={},flowers=[];
const Q=[
["time","When does our adventure begin? ⏰",[["18:00","Early start","🕕"],["19:00","Evening mode","🌙"]]],
["dress","Choose your entrance style. 👗",[["Cute to enter","Dress cute","✨"],["Comfy mode","Maximum comfort","🧸"],["Pyjamas","If I stay","🌙"]]],
["food","Dinner quest: spin the wheel! 🍴","wheel"],
["drink","Pick the drink vibe. 🥤",[["Soft drinks","Classic","🥤"],["Sweet drinks","Treat mode","🧋"],["Mocktail","Fancy","🍹"],["Surprise","You choose","🎲"]]],
["activity","The lights go down... what happens? 🎬","couch"],
["dessert","Choose your dessert reward. 🍰",[["Chocolate mousse","Homemade chocolate","🍫"],["Tiramisu","Coffee perfection","☕"],["Fresh cookies","Straight from the oven","🍪"],["Surprise","No spoilers","🎁"]]],
["flowers","Build a tiny bouquet. 🌷","flowers"],
["sleep","If the evening gets way too cosy... 🌙",[["Go home","Still a great date","🏠"],["Maybe stay","We decide later","🛏️"],["Stay over","Pyjamas, cuddles & kisses","🧸"]]],
["end","Final vibe check. ❤️",[["Cuddles","Cuddle mode","🥰"],["Kisses","Kiss mode","💋"],["Laugh until we hurt","Chaos mode","😂"],["Everything","Full package","❤️"]]]
];
function esc(x){return String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function rain(k=15){for(let i=0;i<k;i++){let x=document.createElement("span");x.className="petal";x.textContent=["🌸","💕","✨","🌷"][Math.floor(Math.random()*4)];x.style.left=Math.random()*100+"%";x.style.animationDelay=Math.random()+ "s";document.body.appendChild(x);setTimeout(()=>x.remove(),5000)}}
function code(){let x=0;Object.values(A).forEach((v,i)=>x+=(Array.isArray(v)?v.length:v+2)*(i+9)*17);let c="ABCDEFGHJKLMNPQRSTUVWXYZ",s="";for(let i=0;i<5;i++){s+=c[x%c.length];x=Math.floor(x/3)+23}return s}
function start(){n=0;A={};flowers=[];rain(20);draw()}
function choose(key,i){A[key]=i;rain(5)}
function cards(q){return `<p class="muted">Choose a card. It flips over and reveals your choice.</p><div class="grid">${q[2].map((o,i)=>`<button class="card" data-i="${i}"><span class="inner"><span class="front"><span class="emoji">${o[2]}</span><b>${esc(o[0])}</b><span class="small">Tap to reveal</span></span><span class="back"><span class="emoji">${o[2]}</span><b>${esc(o[1])}</b><span class="small">Choice unlocked ✨</span></span></span></button>`).join("")}</div><div class="actions"><button class="btn soft" id="back">← Back</button><button class="btn pink" id="next" disabled>Continue →</button></div>`}
function draw(){if(n<0){box.innerHTML=`<div class="center scene"><div class="heart">💌</div><div class="ey">A tiny adventure for you</div><h1>Our Date Night</h1><p class="muted">Not a questionnaire. A little game where you build our evening one choice at a time. ❤️</p><button class="btn pink" id="start">START THE ADVENTURE ✨</button></div>`;document.getElementById("start").onclick=start;return}
if(n>=Q.length){let food=["McDo","Homemade pizza","Pasta","Fresh fries + meat"][A.food??0],act=["Nonkels","Monopoly","Another game","Just talk"][A.activity??0],des=["Chocolate mousse","Tiramisu","Fresh cookies","Surprise"][A.dessert??0],sleep=A.sleep===2,time=A.time===0?"18:00":"19:00";rain(35);box.innerHTML=`<div class="center final"><div class="heart">💖</div><div class="ey">All missions complete</div><h1>Your Date Night is unlocked</h1><p class="muted">You made the choices. I’ll take it from here. 😉</p><div class="rows"><div class="row">⏰ <b>Arrival:</b> ${time}</div><div class="row">🍴 <b>Food:</b> ${food}</div><div class="row">🎬 <b>After dinner:</b> ${act}</div><div class="row">🍰 <b>Dessert:</b> ${des}</div><div class="row">🌷 <b>Flower mission:</b> complete 💐</div><div class="row">🌙 <b>Ending:</b> ${sleep?"Sleepover unlocked — comfy pyjamas, cuddles & kisses. 🧸":"We’ll see where the evening takes us. ✨"}</div></div><div class="code">${code()}</div><p class="muted"><b>Secret mission code</b><br>Send this code to me. I’ll know what it means. ❤️</p><button class="btn soft" id="again">Play again</button></div>`;document.getElementById("again").onclick=start;return}
let q=Q[n],body=`<div class="scene"><div class="ey">Chapter ${n+1} / ${Q.length}</div><div class="bar"><i style="width:${(n+1)/Q.length*100}%"></i></div><h2>${esc(q[1])}</h2>`;
if(q[2]==="wheel")body+=`<p class="muted">Spin the wheel. Dinner will be chosen by fate. 🍴</p><div class="pointer center">▼</div><div class="wheel" id="wheel">🍴</div><div class="center"><button class="btn pink" id="spin">SPIN 🎡</button><p id="result" class="muted"></p></div><div class="actions"><button class="btn soft" id="back">← Back</button><button class="btn pink" id="next" disabled>Continue →</button></div>`;
else if(q[2]==="couch")body+=`<p class="muted">The lights go down. Choose what happens next.</p><div class="couch">📺</div><div class="grid" style="margin-top:14px">${[["Nonkels","Series night","📺"],["Monopoly","Game night","🎲"],["Another game","Game night","🎮"],["Just talk","No plan","💬"]].map((o,i)=>`<button class="card" data-i="${i}"><span class="inner"><span class="front"><span class="emoji">${o[2]}</span><b>${o[0]}</b><span class="small">Reveal</span></span><span class="back"><span class="emoji">${o[2]}</span><b>${o[1]}</b><span class="small">Chapter unlocked ✨</span></span></span></button>`).join("")}</div><div class="actions"><button class="btn soft" id="back">← Back</button><button class="btn pink" id="next" disabled>Continue →</button></div>`;
else if(q[2]==="flowers")body+=`<p class="muted">Pick the flowers that catch your eye. I’m not saying why. 😉</p><div class="bouquet" id="bouquet">🏺</div><div class="flowers">${[["🌸","Soft & romantic"],["🌹","Classic & elegant"],["🌻","Bright & cheerful"],["🌿","Natural & calm"],["💐","A little of everything"]].map((o,i)=>`<button class="flower" data-i="${i}">${o[0]}<br><small>${o[1]}</small></button>`).join("")}</div><div class="actions"><button class="btn soft" id="back">← Back</button><button class="btn pink" id="next" disabled>Continue →</button></div>`;
else body+=cards(q);
body+="</div>";box.innerHTML=body;
box.querySelectorAll(".card").forEach(b=>b.addEventListener("click",()=>{box.querySelectorAll(".card").forEach(c=>c.classList.remove("flip"));b.classList.add("flip");choose(q[0],+b.dataset.i);let x=document.getElementById("next");if(x){x.disabled=false;x.removeAttribute("disabled");}}));
if(document.getElementById("back"))document.getElementById("back").onclick=()=>{n--;draw()};
if(document.getElementById("next"))document.getElementById("next").onclick=()=>{if(A[q[0]]!==undefined||q[2]==="flowers") {n++;draw()}};
if(q[2]==="wheel"){document.getElementById("spin").onclick=()=>{let j=Math.floor(Math.random()*4),w=document.getElementById("wheel");w.style.transform=`rotate(${1440+j*90}deg)`;document.getElementById("spin").disabled=true;setTimeout(()=>{A.food=j;document.getElementById("result").innerHTML=`<b>${["🍔 McDo","🍕 Homemade pizza","🍝 Pasta","🍟 Fresh fries + meat"][j]}</b><br>Dinner path unlocked ✨`;document.getElementById("next").disabled=false;rain(10)},1500)}}
if(q[2]==="flowers")box.querySelectorAll(".flower").forEach(b=>b.onclick=()=>{let j=+b.dataset.i;if(!flowers.includes(j))flowers.push(j);b.classList.toggle("on");A.flowers=flowers;document.getElementById("bouquet").textContent=flowers.length?"💐":"🏺";document.getElementById("next").disabled=!flowers.length;rain(3)});
}
draw();
})();

</script></body></html>
