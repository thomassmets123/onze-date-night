<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Date Night ❤️</title>
<style>
:root{--pink:#c02668;--pinkbg:#fff0f6;--ink:#321d28;--muted:#806c75;--line:#eadbe1}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(145deg,#fff7fa,#fff);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:18px}
.card{width:min(680px,100%);background:#fff;border:1px solid var(--line);border-radius:26px;padding:24px;box-shadow:0 12px 40px rgba(80,30,50,.08)}
.center{text-align:center}.heart{font-size:54px;margin:10px 0}.kicker{text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:var(--pink);font-weight:800}.title{font-size:30px;line-height:1.1;margin:10px 0}.sub{color:var(--muted);line-height:1.5}
.progress{height:5px;background:#f2e8ec;border-radius:99px;margin:18px 0 25px;overflow:hidden}.bar{height:100%;background:var(--pink);transition:width .3s}
.question{font-size:25px;line-height:1.2;margin:8px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.choice{min-height:66px;padding:13px;border:1px solid var(--line);background:#fff;border-radius:16px;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.choice:hover,.choice.sel{border:2px solid var(--pink);background:var(--pinkbg)}
.choice b{display:block;font-size:16px}.choice span{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.actions{display:flex;justify-content:space-between;gap:9px;margin-top:20px}
button{min-height:46px;padding:11px 18px;border-radius:14px;border:0;font:inherit;font-weight:750;cursor:pointer}
.primary{background:var(--pink);color:#fff}.secondary{background:var(--pinkbg);color:var(--ink)}
.code{font-size:27px;letter-spacing:.22em;font-weight:900;background:var(--pinkbg);border-radius:16px;padding:16px;margin:18px 0}
.note{font-size:12px;color:var(--muted)}
@media(max-width:520px){.card{padding:18px}.grid{grid-template-columns:1fr 1fr}.title{font-size:27px}.question{font-size:22px}}
</style>
</head>
<body>
<main class="card" id="screen"></main>
<script>
(() => {
const screen=document.getElementById("screen");
let step=-1; const answers=[];
const qs=[
{q:"When should the date begin? ⏰",opts:[["18:00","Early start — more time together."],["19:00","A little later — perfect evening vibe."]]},
{q:"Okay, important question... 👗",opts:[["✨ Cute to enter","Dress up a little."],["🧸 Comfy mode","Comfy clothes approved."],["🌙 Pyjamas","If I stay over, pyjamas it is."]]},
{q:"What are we eating? 🍴",opts:[["🍔 McDo","Classic comfort food."],["🍕 Homemade pizza","We make it together."],["🍝 Pasta","Cozy homemade dinner."],["🍟 Fresh fries + meat","Fries, your choice of meat."],["🎁 Surprise me","You decide."]]},
{q:"And something to drink? 🥤",opts:[["🥤 Cola / Fanta","Classic."],["🧋Something sweet","Fun drink energy."],["🍹 Mocktail","Fancy but alcohol-free."],["💧Keep it simple","Just something refreshing."]]},
{q:"What happens after dinner? 🎲",opts:[["📺 Nonkels","Couch + series."],["🎲 Monopoly","Winner gets bragging rights."],["🎮 Game night","Let the chaos begin."],["💬 Just talk","No plan. Just us."]]},
{q:"Dessert is mandatory. What wins? 🍰",opts:[["🍫 Chocolate mousse","Rich, homemade and dangerous."],["☕ Tiramisu","Coffee + creamy perfection."],["🍪 Fresh cookies","Straight from the oven."],["🎁 Surprise dessert","No spoilers."]]},
{q:"Quick vibe check... 🌷",opts:[["🌸 Soft & romantic","Pastel, flowers, cozy vibes."],["🌹 Classic & elegant","A little dramatic."],["🌻 Bright & cheerful","Happy colours and sunshine."],["🌿 Simple & natural","Soft, calm and minimal."]]},
{q:"And if the evening is just too nice to end... 🌙",opts:[["🏠 I go home","Still a great evening."],["🛏️ Maybe I stay","Let's see how the night goes."],["🧸 Sleepover","Comfy pyjamas, cuddles & kisses."]]},
{q:"One last question... 💕",opts:[["🥰 Lots of cuddles","Absolutely."],["💋 Lots of kisses","Also absolutely."],["😂 Laugh until we hurt","Priority."],["❤️ All of the above","Obviously."]]}
];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function code(){
 const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ"; let n=0;
 answers.forEach((a,i)=>n+=(a+1)*(i+7)*13);
 let s=""; for(let i=0;i<4;i++){s+=letters[(n+i*17)%26];n=Math.floor(n/3)+11}
 return s;
}
function render(){
 if(step<0){
  screen.innerHTML=`<div class="center"><div class="heart">💌</div><div class="kicker">A little game for you</div><h1 class="title">Our Date Night</h1><p class="sub">I have a few very important questions for you.<br>Choose carefully... some answers may have consequences. 😉</p><button class="primary" id="start">START ❤️</button></div>`;
  document.getElementById("start").onclick=()=>{step=0;render()}; return;
 }
 if(step>=qs.length){
  const sleep=answers[7]===2;
  screen.innerHTML=`<div class="center"><div class="heart">✨</div><div class="kicker">Mission complete</div><h1 class="title">Date Night Unlocked</h1><p class="sub">You made your choices. I have everything I need to plan something nice. ❤️</p><div class="code">${code()}</div><p class="sub"><b>Secret code</b><br>Send this code back to me. I will know what it means. 😉</p><p class="note">${sleep?"🧸 Sleepover mode detected. Comfy pyjamas approved.":"🌙 No sleepover selected — the evening can still be perfect."}</p><button class="secondary" id="restart">Play again</button></div>`;
  document.getElementById("restart").onclick=()=>{step=-1;answers.length=0;render()}; return;
 }
 const x=qs[step], selected=answers[step];
 screen.innerHTML=`<div class="kicker">Question ${step+1} of ${qs.length}</div><div class="progress"><div class="bar" style="width:${((step+1)/qs.length)*100}%"></div></div><h2 class="question">${esc(x.q)}</h2><div class="grid">${x.opts.map((o,i)=>`<button class="choice ${selected===i?"sel":""}" data-i="${i}"><b>${esc(o[0])}</b><span>${esc(o[1])}</span></button>`).join("")}</div><div class="actions"><button class="secondary" id="back" ${step===0?"disabled":""}>← Back</button><button class="primary" id="next">${step===qs.length-1?"Finish ❤️":"Next →"}</button></div>`;
 screen.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{answers[step]=Number(b.dataset.i);render()});
 document.getElementById("back").onclick=()=>{if(step>0){step--;render()}};
 document.getElementById("next").onclick=()=>{if(answers[step]===undefined){document.querySelector(".question").insertAdjacentHTML("afterend",'<p class="note">Choose one first 😉</p>');return}step++;render()};
}
render();
})();
</script>
</body>
</html>
